[pytest]
# pytest 配置文件

# 测试文件匹配模式
python_files = test_*.py *_test.py

# 测试类匹配模式
python_classes = Test*

# 测试函数匹配模式
python_functions = test_*

# Python模块搜索路径（让 import agents.xxx 生效）
pythonpath = app

# 添加命令行选项
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 标记定义
markers =
    slow: 标记慢速测试(需要真实LLM/DB)
    integration: 标记集成测试
    unit: 标记单元测试

# 测试路径
testpaths = tests

# asyncio模式
asyncio_mode = auto

# 最小 Python 版本
minversion = 6.0
