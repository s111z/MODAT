<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 代理工作流程</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f5f5f5;
    display: flex;
    justify-content: center;
    padding: 20px;
    margin: 0;
  }
  .card {
    background: #ffffff;
    width: 100%;
    max-width: 800px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    overflow: hidden;
  }
  
  /* 顶部标签页 */
  .tabs {
    display: flex;
    border-bottom: 1px solid #e8e8e8;
    background: #fafafa;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 14px 0;
    font-size: 14px;
    color: #595959;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }
  .tab.active {
    color: #1890ff;
    background: #ffffff;
    border-bottom: 2px solid #1890ff;
    font-weight: 500;
  }

  /* 工作流头部进度 */
  .header {
    padding: 20px 24px 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-icon {
    font-size: 18px;
    color: #595959;
  }
  .header-title {
    font-size: 15px;
    font-weight: 600;
    color: #262626;
  }
  .progress-wrapper {
    padding: 0 24px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #f0f0f0;
  }
  .progress-bar-bg {
    flex: 1;
    height: 4px;
    background: #e6f7ff;
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }
  .progress-bar-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%; /* 模拟全完成状态 */
    background: #1890ff;
  }
  .progress-text {
    font-size: 13px;
    color: #8c8c8c;
  }

  /* 流程列表基础样式 */
  .flow-list {
    display: flex;
    flex-direction: column;
  }
  .flow-item {
    border-bottom: 1px solid #f0f0f0;
  }
  .flow-header {
    display: flex;
    align-items: center;
    padding: 16px 24px;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .flow-header:hover {
    background-color: #fafafa;
  }
  .flow-icon {
    width: 24px;
    font-size: 16px;
    margin-right: 12px;
    text-align: center;
    color: #8c8c8c;
  }
  .flow-title {
    flex: 1;
    font-size: 14px;
    color: #262626;
    font-weight: 500;
  }
  
  /* 状态标签样式 */
  .status-tag {
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .status-tag.success {
    color: #52c41a;
  }
  .status-tag.running {
    color: #faad14;
  }
  .arrow {
    font-size: 10px;
    transform: scale(0.8);
    color: #bfbfbf;
    transition: transform 0.3s;
  }
  .flow-item.expanded .arrow {
    transform: scale(0.8) rotate(180deg);
  }

  /* 下拉展开内容区 */
  .flow-content {
    display: none;
    background-color: #fafafa;
    padding: 8px 24px 16px 60px;
    border-top: 1px dashed #e8e8e8;
  }
  .flow-item.expanded .flow-content {
    display: block;
  }

  /* 子任务样式 */
  .sub-item {
    display: flex;
    align-items: center;
    padding: 10px 0;
    font-size: 13px;
    color: #595959;
    border-bottom: 1px dashed #f0f0f0;
  }
  .sub-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }
  .sub-icon {
    margin-right: 10px;
    font-size: 14px;
  }
  .sub-title {
    flex: 1;
  }
  .sub-status {
    font-size: 12px;
    color: #52c41a; /* 默认设为成功色 */
  }

</style>
</head>
<body>

<div class="card">
  <div class="tabs">
    <div class="tab">📄 文档预览</div>
    <div class="tab active">⚙️ 工作流程</div>
    <div class="tab">📊 审核报告</div>
    <div class="tab">✍️ 方案优化</div>
  </div>

  <div class="header">
    <span class="header-icon">⚙️</span>
    <span class="header-title">审核工作流程</span>
  </div>
  <div class="progress-wrapper">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="progress-text">100%</div>
  </div>

  <div class="flow-list">
    
    <div class="flow-item">
      <div class="flow-header">
        <span class="flow-icon">✅</span>
        <span class="flow-title">文档分析</span>
        <span class="status-tag success">已完成 <span class="arrow">▼</span></span>
      </div>
    </div>

    <div class="flow-item">
      <div class="flow-header">
        <span class="flow-icon">📋</span>
        <span class="flow-title">Schema提取</span>
        <span class="status-tag success">已完成 <span class="arrow">▼</span></span>
      </div>
    </div>

    <div class="flow-item">
      <div class="flow-header">
        <span class="flow-icon">🔨</span>
        <span class="flow-title">查询构造</span>
        <span class="status-tag success">已完成 <span class="arrow">▼</span></span>
      </div>
    </div>

    <div class="flow-item expanded">
      <div class="flow-header">
        <span class="flow-icon">🧰</span>
        <span class="flow-title">MCP 工具路由</span>
        <span class="status-tag success">已完成 <span class="arrow">▼</span></span>
      </div>
      <div class="flow-content">
        <div class="sub-item">
          <span class="sub-icon">📚</span>
          <span class="sub-title">知识库检索 Server</span>
          <span class="sub-status">已完成</span>
        </div>
        <div class="sub-item">
          <span class="sub-icon">🌐</span>
          <span class="sub-title">网络检索 Server</span>
          <span class="sub-status">已完成</span>
        </div>
        <div class="sub-item">
          <span class="sub-icon">🧮</span>
          <span class="sub-title">计算校验 Server</span>
          <span class="sub-status">已完成</span>
        </div>
        <div class="sub-item">
          <span class="sub-icon">⚖️</span>
          <span class="sub-title">合规审查 Server</span>
          <span class="sub-status">已完成</span>
        </div>
      </div>
    </div>

    <div class="flow-item">
      <div class="flow-header">
        <span class="flow-icon">🔄</span>
        <span class="flow-title">多渠道解析与对齐</span>
        <span class="status-tag success">已完成 <span class="arrow">▼</span></span>
      </div>
    </div>

    <div class="flow-item">
      <div class="flow-header">
        <span class="flow-icon">⚔️</span>
        <span class="flow-title">多路 PK</span>
        <span class="status-tag success">已完成 <span class="arrow">▼</span></span>
      </div>
    </div>

    <div class="flow-item">
      <div class="flow-header">
        <span class="flow-icon">🔍</span>
        <span class="flow-title">质询自查</span>
        <span class="status-tag success">已完成 <span class="arrow">▼</span></span>
      </div>
    </div>

    <div class="flow-item">
      <div class="flow-header">
        <span class="flow-icon">📄</span>
        <span class="flow-title">报告生成</span>
        <span class="status-tag success">已完成 <span class="arrow">▼</span></span>
      </div>
    </div>

    <div class="flow-item">
      <div class="flow-header">
        <span class="flow-icon">✍️</span>
        <span class="flow-title">方案重写</span>
        <span class="status-tag success">已完成 <span class="arrow">▼</span></span>
      </div>
    </div>

    <div class="flow-item">
      <div class="flow-header">
        <span class="flow-icon">💬</span>
        <span class="flow-title">回复生成</span>
        <span class="status-tag success">已完成 <span class="arrow">▼</span></span>
      </div>
    </div>

  </div>
</div>

<script>
  // 简单的点击展开/收起交互逻辑
  document.querySelectorAll('.flow-header').forEach(header => {
    header.addEventListener('click', () => {
      const parentItem = header.parentElement;
      // 只有包含子内容的才进行 toggle
      if(parentItem.querySelector('.flow-content')) {
        parentItem.classList.toggle('expanded');
      }
    });
  });
</script>

</body>
</html>
