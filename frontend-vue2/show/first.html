<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mota - Minimalist UI</title>
    <style>
        /* 基础重置与背景设定 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            /* 模拟图片中的暖色调渐变背景 */
            background: linear-gradient(135deg, #fdfbf7 0%, #f4ebd9 60%, #e6d3ba 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 左上角 Logo 区域 */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 留空的图标占位符，供大模型或开发者后续填入真实 Icon */
        .logo-icon {
            width: 40px;
            height: 40px;
            background-color: transparent;
            border: 1px dashed #999; /* 虚线框表示这里是占位符 */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo-icon::after {
            content: 'Icon';
            font-size: 10px;
            color: #999;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 900;
            color: #000;
            letter-spacing: -1px;
        }

        /* 画面中央的核心内容区 */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -60px; /* 视觉微调，使其更偏上一点点 */
        }

        /* 巨大的主标题 */
        .main-title {
            font-size: 100px;
            font-weight: 900;
            color: #000;
            margin: 0 0 20px 0;
            letter-spacing: -4px;
            line-height: 1;
        }

        /* 按钮容器 */
        .button-container {
            display: flex;
            gap: 20px;
            margin-bottom: -15px; /* 让按钮和底部的弧形更贴近 */
            z-index: 2; 
        }

        /* 两个空白按钮 */
        .btn {
            width: 160px;
            height: 50px;
            background-color: #f2e6d3; /* 偏暖的按钮底色 */
            border-radius: 6px;
            /* 软阴影增加立体感 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1), inset 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        /* 底部微笑/叶片装饰区 */
        .smile-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* 使用 SVG 绘制弧形轮廓 */
        .smile-svg {
            width: 300px;
            height: auto;
            /* 给弧形增加一点柔和的光影 */
            filter: drop-shadow(0px 8px 6px rgba(180, 100, 50, 0.3));
        }

        /* 模拟图片中最下方那一抹模糊的倒影/光晕 */
        .smile-shadow {
            width: 200px;
            height: 20px;
            background: rgba(180, 110, 40, 0.4);
            border-radius: 50%;
            filter: blur(12px);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="logo-icon"></div>
        <span class="logo-text">mota</span>
    </div>

    <div class="main-content">
        <h1 class="main-title">mota</h1>
        
        <div class="button-container">
            <div class="btn"></div>
            <div class="btn"></div>
        </div>

        <div class="smile-container">
            <svg viewBox="0 0 300 60" class="smile-svg">
                <path d="M 20 20 Q 150 80 280 20 Q 150 50 20 20" fill="#a45827" />
            </svg>
            <div class="smile-shadow"></div>
        </div>
    </div>

</body>
</html>
